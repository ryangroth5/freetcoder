[project]
name = "freetcoder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "openai>=1.54",
  "aiosqlite>=0.20",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "pyseccomp>=0.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-timeout>=2.3",
       "ruff>=0.7", "mypy>=1.13", "types-PyYAML"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["freetcoder*"]

[tool.ruff]
# Source is mounted read-only in dev.
cache-dir = "/tmp/.ruff_cache"
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
cache_dir = "/tmp/.mypy_cache"
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
# Source is mounted read-only in dev; keep pytest state off it.
cache_dir = "/tmp/.pytest_cache"
asyncio_mode = "auto"
timeout = 60
markers = ["live: hits a real LLM endpoint; opt-in"]
